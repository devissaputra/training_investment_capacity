name: Source fingerprint

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Download official DfE source and print SHA256
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://explore-education-statistics.service.gov.uk/data-catalogue/data-set/a07479d1-e26d-4b66-9ec9-e683917c1388/csv"
          req = urllib.request.Request(url, headers={"User-Agent": "training-investment-capacity/1.0"})
          with urllib.request.urlopen(req) as r:
              payload = r.read()
          print("SOURCE_BYTES", len(payload))
          print("SOURCE_SHA256", hashlib.sha256(payload).hexdigest())
          PY
