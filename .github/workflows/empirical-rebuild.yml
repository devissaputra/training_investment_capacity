name: Empirical rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_and_analyze.py"
      - "research/**"
      - "tests/**"
      - "data/source_manifest.json"
      - "data/derived/**"
      - "results/empirical_summary.json"
      - ".github/workflows/empirical-rebuild.yml"

permissions:
  contents: read

concurrency:
  group: empirical-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify pinned DfE source and released evidence
        run: python scripts/fetch_and_analyze.py --check
