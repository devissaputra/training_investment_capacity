<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="#ffffff"/><rect width="1200" height="92" fill="#312e81"/><text x="52" y="43" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffffff">Employer Training Investment — Reproducible Analysis</text><text x="52" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#e0e7ff">Official ESS data → comparable waves → reach/intensity separation → sector evidence</text><rect x="45" y="135" width="205" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="63" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">1 • Official data</text><text x="63" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">7,848 ESS rows</text><text x="63" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">National + sector data</text><text x="63" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Pinned SHA-256</text><rect x="290" y="135" width="205" height="125" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="308" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">2 • Comparable UK</text><text x="308" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2011 / 13 / 15 / 17</text><text x="308" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2022 / 2024</text><text x="308" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2019 excluded</text><rect x="535" y="135" width="205" height="125" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="553" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">3 • Real intensity</text><text x="553" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2024-price fields</text><text x="553" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Spend / employee</text><text x="553" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Spend / trainee</text><rect x="780" y="135" width="205" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="798" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">4 • Reach proxy</text><text x="798" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Trainees / employees</text><text x="798" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Approx. aggregate ratio</text><text x="798" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Keep derivation visible</text><line x1="250" y1="198" x2="278" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="278,192 290,198 278,204" fill="#64748b"/><line x1="495" y1="198" x2="523" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="523,192 535,198 523,204" fill="#64748b"/><line x1="740" y1="198" x2="768" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="768,192 780,198 768,204" fill="#64748b"/><rect x="780" y="335" width="205" height="135" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="798" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">5 • Longitudinal</text><text x="798" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Six-wave trajectory</text><text x="798" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Endpoint changes</text><text x="798" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2022–24 divergence</text><line x1="882" y1="260" x2="870" y2="335" stroke="#dc2626" stroke-width="2"/><polygon points="870,329 882,335 870,341" fill="#dc2626"/><rect x="505" y="335" width="225" height="135" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="523" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">6 • Sector evidence</text><text x="523" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">13 sectors in 2024</text><text x="523" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Range / ratio / median</text><text x="523" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Unweighted CV</text><line x1="780" y1="402" x2="718" y2="402" stroke="#16a34a" stroke-width="2"/><polygon points="718,396 730,402 718,408" fill="#16a34a"/><rect x="230" y="335" width="225" height="135" rx="15" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="248" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#0e7490">7 • Triangulate</text><text x="248" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Total expenditure</text><text x="248" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Per-person intensity</text><text x="248" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Reach</text><line x1="505" y1="402" x2="443" y2="402" stroke="#0891b2" stroke-width="2"/><polygon points="443,396 455,402 443,408" fill="#0891b2"/><rect x="230" y="540" width="755" height="105" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="248" y="571" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#334155">8 • Bounded L&amp;D interpretation</text><text x="248" y="597" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Separate reach, resource intensity, and sector context before judging training capacity</text><text x="248" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Do not infer quality, transfer, skill gain, or causal ROI from expenditure alone</text><line x1="342" y1="470" x2="330" y2="540" stroke="#0891b2" stroke-width="2"/><polygon points="330,534 342,540 330,546" fill="#0891b2"/><line x1="618" y1="470" x2="606" y2="540" stroke="#16a34a" stroke-width="2"/><polygon points="606,534 618,540 606,546" fill="#16a34a"/><line x1="882" y1="470" x2="870" y2="540" stroke="#dc2626" stroke-width="2"/><polygon points="870,534 882,540 870,546" fill="#dc2626"/><text x="52" y="700" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Scientific safeguard: official estimates, repository-derived ratios, and interpretation remain explicitly separated.</text></svg>