<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#ffffff"/><rect width="1200" height="92" fill="#7c2d12"/><text x="52" y="43" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffffff">Evidence Boundary for Employer Training Investment</text><text x="52" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#ffedd5">What the official aggregate data support — and what they do not</text><rect x="55" y="115" width="1090" height="96" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><text x="73" y="146" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">Long-run real intensity</text><text x="73" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Spend per employee: £2,410 → £1,700 (−29.46%); spend per trainee: −38.69%; total real expenditure: −18.53%.</text><rect x="55" y="235" width="1090" height="96" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="266" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Reach-intensity divergence</text><text x="73" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2022→2024 derived reach: 60.22% → 62.85%, while spend per employee fell £1,960 → £1,700.</text><rect x="55" y="355" width="1090" height="96" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="73" y="386" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Sector heterogeneity</text><text x="73" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">2024 spend per employee ranges £920–£2,630; national averages do not describe every sector's resource environment.</text><rect x="55" y="475" width="1090" height="96" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="73" y="506" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">Claim boundary</text><text x="73" y="532" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Expenditure and reach do not directly measure training quality, learning transfer, skill gain, causal ROI, or latent organizational capability.</text><text x="52" y="635" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">L&amp;D use: treat reach, resource intensity, and outcome evidence as separate layers when diagnosing training capacity.</text></svg>